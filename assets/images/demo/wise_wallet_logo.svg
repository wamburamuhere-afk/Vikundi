<?xml version="1.0" encoding="UTF-8"?>
<!-- Wise Wallet M-KOBA — demo group logo. Original artwork made for the Vikundi demo site; not a real organisation's mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Wise Wallet">
  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0F766E"/>
  <!-- coin rising out of the wallet -->
  <circle cx="330" cy="168" r="70" fill="#FBBF24"/>
  <circle cx="330" cy="168" r="48" fill="none" stroke="#B45309" stroke-width="10"/>
  <!-- wallet body -->
  <rect x="96" y="190" width="320" height="226" rx="40" fill="#FFFFFF"/>
  <!-- flap line -->
  <path d="M96 262 H416" stroke="#0F766E" stroke-width="14" stroke-linecap="round"/>
  <!-- clasp tab -->
  <rect x="300" y="296" width="150" height="76" rx="38" fill="#0F766E"/>
  <circle cx="342" cy="334" r="16" fill="#FBBF24"/>
  <!-- the "W" for Wise, stitched on the wallet -->
  <path d="M138 300 L164 372 L190 318 L216 372 L242 300" fill="none" stroke="#0F766E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
