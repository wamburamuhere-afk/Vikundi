name: Deploy

# main    → the live groups (shared folder /srv/vikundi/app: UKUU, demo, Wise
#           Wallet, the super-admin panel). Every group's database is migrated.
# develop → the test site, vikundi.bjptechnologies.co.tz, where changes are
#           checked before they are released to main.
# The branch that was pushed is the branch that is deployed: a target never
# receives code from the other branch.
on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[{"name":"groups","path":"/srv/vikundi/app","mode":"shared"}]' || '[{"name":"test-site","path":"/var/www/vikundi.bjptechnologies.co.tz/public_html","mode":"single"}]') }}

    name: Deploy ${{ matrix.name }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SITE_NAME: ${{ matrix.name }}
          SITE_PATH: ${{ matrix.path }}
          SITE_MODE: ${{ matrix.mode }}
          SITE_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SITE_NAME,SITE_PATH,SITE_MODE,SITE_BRANCH
          script: |
            set -e

            echo "==> Target: $SITE_NAME ($SITE_PATH) from $SITE_BRANCH"

            # Fail loudly rather than skipping. A silent skip is how the live
            # site sat on stale code before — an absent or non-git directory is
            # a setup problem we need told about, not swallowed.
            if [ ! -d "$SITE_PATH" ]; then
              if [ "$SITE_MODE" = "shared" ]; then
                echo "==> $SITE_PATH is not set up on this server yet; skipping the shared target."
                exit 0
              fi
              echo "ERROR: $SITE_PATH does not exist on this server." >&2
              exit 1
            fi
            cd "$SITE_PATH"
            if [ ! -d .git ]; then
              echo "ERROR: $SITE_PATH is not a git checkout. Clone the repo there once:" >&2
              echo "  git clone <repo-url> $SITE_PATH" >&2
              exit 1
            fi

            echo "==> Force-syncing working tree to origin/$SITE_BRANCH"
            # A plain 'git pull' silently fails when the server tree is dirty,
            # leaving the site on stale code (e.g. missing SMS Settings). Force
            # it to match the pushed branch; checkout -B also moves a checkout
            # that was on the other branch. config.php and vendor/ are
            # gitignored, so they survive — which is what keeps each site
            # pointed at its own database.
            git fetch origin "$SITE_BRANCH"
            git checkout -q -B "$SITE_BRANCH" "origin/$SITE_BRANCH"
            git reset --hard "origin/$SITE_BRANCH"

            echo "==> Installing PHP dependencies (PHPMailer etc.)"
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader || echo "composer step skipped"
            else
              echo "composer not found on server — skipping (install it to enable email sending)"
            fi

            echo "==> Running database migrations"
            if [ "$SITE_MODE" = "shared" ]; then
              # Every group, one at a time. A failing group fails the deploy so
              # it is seen; the other groups are still migrated.
              php bin/migrate_all.php
            else
              php database/migrate.php || echo "migrate step reported issues"
            fi

            echo "==> Clearing PHP OPcache so updated files take effect immediately"
            php -r 'if (function_exists("opcache_reset")) { opcache_reset(); echo "opcache reset\n"; }' || true

            echo "==> Deployed commit: $(git rev-parse --short HEAD) at $(date)"
            echo "Deployment of $SITE_NAME was successful!"
