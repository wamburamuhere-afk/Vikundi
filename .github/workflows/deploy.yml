name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      # Never let one site's failure cancel the other's deploy. If the shared
      # folder breaks, production must still go out (and vice versa) — the red
      # job tells us which one needs attention.
      fail-fast: false
      # One at a time: both targets are the same box and share composer's cache
      # directory, so parallel runs can race on it. Production goes first.
      max-parallel: 1
      matrix:
        include:
          - name: production
            path: /var/www/vikundi.bjptechnologies.co.tz/public_html
          # The shared multi-group folder (includes/tenant_config.php). One pull
          # updates every group on it; bin/migrate_all.php migrates each group's
          # own database. Skipped until the server has been set up for it.
          # The demo site lives here as the group `demo` (moved 2026-10-18).
          - name: shared
            path: /srv/vikundi/app
            mode: shared

    name: Deploy ${{ matrix.name }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SITE_NAME: ${{ matrix.name }}
          SITE_PATH: ${{ matrix.path }}
          SITE_MODE: ${{ matrix.mode || 'single' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SITE_NAME,SITE_PATH,SITE_MODE
          script: |
            set -e

            echo "==> Target: $SITE_NAME ($SITE_PATH)"

            # Fail loudly rather than skipping. A silent skip is how the live
            # site sat on stale code before — an absent or non-git directory is
            # a setup problem we need told about, not swallowed.
            if [ ! -d "$SITE_PATH" ]; then
              if [ "$SITE_MODE" = "shared" ]; then
                echo "==> $SITE_PATH is not set up on this server yet; skipping the shared target."
                exit 0
              fi
              echo "ERROR: $SITE_PATH does not exist on this server." >&2
              exit 1
            fi
            cd "$SITE_PATH"
            if [ ! -d .git ]; then
              echo "ERROR: $SITE_PATH is not a git checkout. Clone the repo there once:" >&2
              echo "  git clone <repo-url> $SITE_PATH" >&2
              exit 1
            fi

            echo "==> Force-syncing working tree to origin/main"
            # A plain 'git pull' silently fails when the server tree is dirty,
            # leaving the live site on stale code (e.g. missing SMS Settings).
            # Force it to match main. config.php and vendor/ are gitignored,
            # so they are preserved by reset --hard — which is what keeps each
            # site pointed at its own database.
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing PHP dependencies (PHPMailer etc.)"
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader || echo "composer step skipped"
            else
              echo "composer not found on server — skipping (install it to enable email sending)"
            fi

            echo "==> Running database migrations"
            if [ "$SITE_MODE" = "shared" ]; then
              # Every group, one at a time. A failing group fails the deploy so
              # it is seen; the other groups are still migrated.
              php bin/migrate_all.php
            else
              php database/migrate.php || echo "migrate step reported issues"
            fi

            echo "==> Clearing PHP OPcache so updated files take effect immediately"
            php -r 'if (function_exists("opcache_reset")) { opcache_reset(); echo "opcache reset\n"; }' || true

            echo "==> Deployed commit: $(git rev-parse --short HEAD) at $(date)"
            echo "Deployment of $SITE_NAME was successful!"
