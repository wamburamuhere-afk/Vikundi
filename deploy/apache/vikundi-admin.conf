# The super-admin panel: https://admin.vikundi.bjptechnologies.co.tz
# Install: sudo cp deploy/apache/vikundi-admin.conf /etc/apache2/sites-available/
#          sudo a2ensite vikundi-admin
# Port 80 for this address is already handled by zz-vikundi-groups.conf
# (certificate checks + redirect to https). The file name sorts before
# zz-vikundi-groups.conf, so this site answers for admin.* before the wildcard.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName admin.vikundi.bjptechnologies.co.tz
    DocumentRoot /srv/vikundi/app/superadmin/public

    # Nothing of the app is served here except the panel's public folder.
    <Directory /srv/vikundi/app>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /srv/vikundi/app/superadmin/public>
        AllowOverride None
        Options -Indexes
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Never the groups' lookup: the panel has its own config (/etc/vikundi/admin.php).
    php_admin_value auto_prepend_file none

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/vikundi-groups/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vikundi-groups/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorLog  ${APACHE_LOG_DIR}/vikundi-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/vikundi-admin-access.log combined
</VirtualHost>
</IfModule>
